<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse style sample 3: Soft depth</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ---------- Soft depth: everything is a physical object. Raised panels, pressed wells, a card you could pick up, a chart with thickness. ---------- */
  .screen { font-weight: 600; }
  .pad { position: absolute; inset: 54px 0 0 0; padding: 10px 20px 0; -webkit-mask-image: linear-gradient(#000 calc(100% - 150px), transparent calc(100% - 84px)); mask-image: linear-gradient(#000 calc(100% - 150px), transparent calc(100% - 84px)); }
  .top { display: flex; align-items: center; gap: 12px; height: 48px; }
  .top .who { flex: 1; line-height: 1.15; }
  .top .who small { display: block; font-size: 13px; }
  .top .who b { font: 700 18px Sora; letter-spacing: -0.02em; }
  .bead { display: grid; place-items: center; border-radius: 50%; color: #fff; background: radial-gradient(circle at 32% 26%, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000)); box-shadow: 0 10px 16px -6px color-mix(in srgb, var(--c) 80%, #000), inset 0 -3px 5px rgba(0,0,0,.28), inset 0 2px 2px rgba(255,255,255,.55); }
  .ava { width: 46px; height: 46px; font: 700 18px Sora; --c: #ff5f5a; }
  .knob { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; }

  /* the card */
  .cardwrap { margin: 16px 12px 0; height: 186px; perspective: 900px; position: relative; }
  .card { position: absolute; inset: 0; border-radius: 30px; padding: 18px 22px; color: #fff; transform-style: preserve-3d; background: linear-gradient(135deg, #ff9a66 0%, #ff5d62 52%, #f03a72 100%); display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 1px 0 #e0465c, 0 2px 0 #d94259, 0 3px 0 #d23e56, 0 4px 0 #ca3a53, 0 5px 0 #c33650, 0 6px 0 #bb324d, 0 7px 0 #b32e4a, 0 34px 44px -14px rgba(255,62,104,.65), inset 0 2px 1px rgba(255,255,255,.6), inset 0 -2px 3px rgba(120,10,40,.35);
    transform: rotateX(16deg) rotateY(-13deg) rotateZ(-2.5deg); }
  .card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(112deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.08) 34%, rgba(255,255,255,0) 35%, rgba(255,255,255,0) 68%, rgba(255,255,255,.14) 100%); pointer-events: none; }
  .card .r1 { display: flex; justify-content: space-between; align-items: center; font: 700 17px Sora; letter-spacing: -0.02em; }
  .card .logo { display: flex; gap: 9px; align-items: center; }
  .card .logo i { width: 32px; height: 32px; border-radius: 11px; background: #fff; color: #ff4d6d; display: grid; place-items: center; box-shadow: 0 4px 8px rgba(120,10,40,.3); }
  .card .logo .ico { width: 20px; height: 20px; stroke-width: 2.8; }
  .card .digits { font: 600 15px Manrope; letter-spacing: .08em; opacity: .92; }
  .card .lbl { font-size: 14.5px; opacity: .92; }
  .card .amt { font: 700 48px/1.05 Sora; letter-spacing: -0.045em; text-shadow: 0 2px 0 rgba(140,20,50,.35); }
  .card .amt small { font-size: 26px; }
  .chip { position: absolute; right: 2px; bottom: -16px; height: 38px; padding: 0 16px 0 8px; border-radius: 19px; display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; z-index: 3; }
  .chip i { width: 24px; height: 24px; --c: #2fbf9c; }
  .chip .ico { width: 14px; height: 14px; stroke-width: 3; }

  .panel { border-radius: 32px; position: relative; }
  .ringcard { margin-top: 30px; padding: 16px 18px 20px 14px; display: flex; align-items: center; gap: 16px; }
  .ring { position: relative; width: 152px; height: 160px; flex: none; }
  .ring svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .ring svg.under { top: 8px; }
  .ring::after { content: ''; position: absolute; left: 0; top: 0; width: 152px; height: 152px; border-radius: 50%; background: linear-gradient(170deg, rgba(255,255,255,.42), rgba(255,255,255,0) 46%, rgba(0,0,0,.2)); -webkit-mask: radial-gradient(circle, transparent 0 47px, #000 48px 75px, transparent 76px); mask: radial-gradient(circle, transparent 0 47px, #000 48px 75px, transparent 76px); pointer-events: none; }
  .ring .mid { position: absolute; left: 0; top: 0; width: 152px; height: 152px; display: grid; place-content: center; text-align: center; }
  .ring .mid b { font: 700 30px/1 Sora; letter-spacing: -0.04em; }
  .ring .mid span { font-size: 12.5px; margin-top: 2px; }
  .legend { flex: 1; display: grid; gap: 8px; }
  .legend li { list-style: none; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 9px; font-size: 14.5px; }
  .legend i { width: 16px; height: 16px; }
  .legend b { font: 700 14.5px Sora; letter-spacing: -0.02em; }

  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 6px 10px; }
  .sec h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .sec a { font-size: 14px; font-weight: 700; }
  .row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 13px; padding: 10px 18px 10px 10px; border-radius: 26px; margin-bottom: 9px; }
  .row .bead { width: 44px; height: 44px; }
  .row .bead .ico { width: 21px; height: 21px; }
  .row b { display: block; font-size: 16px; font-weight: 700; }
  .row small { font-size: 13px; }
  .row .a { font: 700 17px Sora; letter-spacing: -0.03em; }

  .tabs { position: absolute; left: 16px; right: 16px; bottom: 24px; height: 70px; border-radius: 35px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; justify-items: center; z-index: 20; }
  .tabs button { width: 50px; height: 50px; border-radius: 25px; display: grid; place-items: center; }
  .tabs .fab { width: 56px; height: 56px; --c: #ff5f5a; margin-top: -4px; }
  .tabs .fab .ico { stroke-width: 2.8; }

  /* ----- dark ----- */
  .dark { background: radial-gradient(120% 70% at 85% 0%, #36209a 0%, #1b1244 48%, #120c2b 100%); color: #fff; }
  .dark .soft { color: rgba(230,224,255,.78); }
  .dark .panel, .dark .knob, .dark .tabs { background: linear-gradient(150deg, #33267e, #1d1550 70%); box-shadow: 0 26px 36px -16px rgba(4,1,20,.95), 0 2px 0 #120c33, inset 0 1.5px 0 rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.4); }
  .dark .well { background: #130c33; box-shadow: inset 0 4px 10px rgba(0,0,0,.7), inset 0 -1.5px 0 rgba(255,255,255,.1); }
  .dark .chip { color: #9af5dc; background: linear-gradient(150deg, #2c3f77, #1b2a58); box-shadow: 0 12px 18px -8px rgba(4,1,20,.9), inset 0 1.5px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.35); }
  .dark .track { stroke: #130c33; }
  .dark .sec a { color: var(--lav); }
  .dark .tabs button { color: rgba(230,224,255,.65); }
  .dark .tabs .on { color: var(--coral-a); background: #130c33; box-shadow: inset 0 4px 8px rgba(0,0,0,.75), inset 0 -1.5px 0 rgba(255,255,255,.12); }
  .dark .tabs .fab { color: #fff; }

  /* ----- light ----- */
  .light { background: linear-gradient(160deg, #f3f0ff, #e2dbff); color: var(--ink-d); }
  .light .status, .light .home-ind { color: var(--ink-d); }
  .light .soft { color: rgba(26,20,64,.62); }
  .light .panel, .light .knob, .light .tabs { background: linear-gradient(150deg, #ffffff, #ebe6ff 75%); box-shadow: 0 22px 30px -14px rgba(92,68,200,.5), 0 2px 0 #cfc6f5, inset 0 2px 0 #fff, inset 0 -2px 0 rgba(120,100,220,.16); }
  .light .well { background: #ddd5fb; box-shadow: inset 0 3px 7px rgba(74,52,170,.42), inset 0 -1.5px 0 #fff; }
  .light .tabs button { color: rgba(26,20,64,.5); }
  .light .tabs .on { color: #f1474f; background: #ddd5fb; box-shadow: inset 0 3px 7px rgba(74,52,170,.45), inset 0 -1.5px 0 #fff; }
  .light .tabs .fab { color: #fff; }

  /* budgets */
  .bhead { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .bhead h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.04em; }
  .month { height: 42px; padding: 0 10px 0 16px; border-radius: 21px; display: inline-flex; align-items: center; gap: 4px; font-size: 14.5px; font-weight: 700; }
  .month .ico { width: 18px; height: 18px; }
  .gcard { margin-top: 14px; padding: 16px 18px 16px; text-align: center; }
  .gauge { position: relative; width: 250px; height: 142px; margin: 0 auto; }
  .gauge svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .gauge path { fill: none; stroke-linecap: round; }
  .gauge .fillp { stroke-dasharray: 0 400; transition: stroke-dasharray 1.4s cubic-bezier(.2,.9,.2,1) .4s; }
  body.in .gauge .fillp { stroke-dasharray: 224.3 400; }
  .gauge .knobg { transform-origin: 125px 128px; transform: rotate(0deg); transition: transform 1.4s cubic-bezier(.2,.9,.2,1) .4s; }
  body.in .gauge .knobg { transform: rotate(128.5deg); }
  .gauge .mid { position: absolute; inset: auto 0 0 0; }
  .gauge .mid b { display: block; font: 700 38px/1 Sora; letter-spacing: -0.045em; }
  .gauge .mid b small { font-size: 21px; }
  .gauge .mid span { font-size: 13px; }
  .facts { display: flex; justify-content: space-between; margin-top: 12px; padding: 10px 16px; border-radius: 18px; font-size: 13.5px; font-weight: 700; }
  .brow { display: grid; grid-template-columns: 42px 1fr; gap: 12px; align-items: center; padding: 10px 18px 10px 10px; border-radius: 26px; margin-top: 9px; }
  .brow .bead { width: 42px; height: 42px; }
  .brow .bead .ico { width: 20px; height: 20px; }
  .brow .l1 { display: flex; justify-content: space-between; align-items: baseline; }
  .brow .l1 b { font-size: 15.5px; font-weight: 700; }
  .brow .l1 span { font: 700 13.5px Sora; letter-spacing: -0.02em; }
  .brow .l1 span em { font-style: normal; font-weight: 600; opacity: .6; }
  .groove { height: 14px; border-radius: 7px; margin-top: 7px; position: relative; }
  .groove i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 0; border-radius: 5px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 60%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 78%, #000)); box-shadow: 0 3px 5px -1px color-mix(in srgb, var(--c) 70%, #000); transition: width 1.1s cubic-bezier(.2,.9,.2,1) calc(var(--d) * 80ms + .5s); }
  body.in .groove i { width: calc(var(--w) - 4px); }
  .brow.over .l1 span { color: #e4352f; }

  /* motion: objects settle with weight */
  .drop { opacity: 0; }
  body.in .drop { animation: drop .75s cubic-bezier(.2,1.25,.35,1) both; animation-delay: calc(var(--d, 0) * 75ms); }
  @keyframes drop { from { opacity: 0; transform: translateY(-22px) scale(1.06); } to { opacity: 1; transform: none; } }
  .card { opacity: 0; }
  body.in .card { animation: deal 1.1s cubic-bezier(.2,1.1,.3,1) .12s both, float 6s ease-in-out 1.3s infinite; }
  @keyframes deal { from { opacity: 0; transform: translateY(70px) rotateX(50deg) rotateY(-60deg) rotateZ(-14deg); } 35% { opacity: 1; } to { opacity: 1; transform: rotateX(16deg) rotateY(-13deg) rotateZ(-2.5deg); } }
  @keyframes float { 0%, 100% { transform: rotateX(16deg) rotateY(-13deg) rotateZ(-2.5deg); } 50% { transform: translateY(-5px) rotateX(11deg) rotateY(-7deg) rotateZ(-1.5deg); } }
  .seg { stroke-dasharray: 0 calc(var(--c) * 1px); transition: stroke-dasharray 1.1s cubic-bezier(.2,.9,.2,1) calc(var(--i) * 110ms + .5s); }
  body.in .seg { stroke-dasharray: calc(var(--len) * 1px) calc(var(--c) * 1px); }
</style>
</head>
<body>
<main class="stage">
  <header><h1>style-3-soft-depth.html</h1><p>Soft depth: raised panels, pressed wells, a card you could pick up and a chart with real thickness. Dashboard in dark, Budgets in light.</p></header>
  <div class="phones">
    <figure class="device" data-screen="dash"><div class="screen dark">
      <div class="pad">
        <div class="top drop"><div class="ava bead">M</div><div class="who"><small class="soft">Good evening</small><b>Maya</b></div><button class="knob" data-i="bell" aria-label="Notifications"></button></div>
        <div class="cardwrap"><div class="card"><div class="r1"><span class="logo"><i data-i="pulse"></i>Pulse</span><span class="digits">•••• 4417</span></div><div><div class="lbl">Spent in November</div><div class="amt num" data-count="1284.6" data-pre="$" data-split data-delay="300"></div></div></div><span class="chip drop" style="--d:9"><i class="bead" data-i="down"></i>12% less than October</span></div>
        <div class="ringcard panel drop" style="--d:3"><div class="ring" id="ring3"><div class="mid"><b class="num" data-count="34" data-dec="0" data-suf="%" data-delay="500"></b><span class="soft">on food</span></div></div><ul class="legend" id="leg3"></ul></div>
        <div class="sec drop" style="--d:4"><h2>Today</h2><a>See all</a></div>
        <div id="tx3"></div>
      </div>
      <nav class="tabs"><button class="on" data-i="home" aria-label="Home"></button><button data-i="pie" aria-label="Categories"></button><button class="fab bead" data-i="plus" aria-label="Add"></button><button data-i="wallet" data-go="budget" aria-label="Budgets"></button><button data-i="chart" aria-label="Insights"></button></nav>
    </div></figure>

    <figure class="device" data-screen="budget"><div class="screen light">
      <div class="pad">
        <div class="bhead drop"><h1>Budgets</h1><button class="month knob" style="width:auto">November<svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
        <div class="gcard panel drop" style="--d:1">
          <div class="gauge">
            <svg width="250" height="150" viewBox="0 0 250 150">
              <defs><linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a66"/><stop offset="1" stop-color="#ff4d6d"/></linearGradient></defs>
              <path d="M25 128A100 100 0 0 1 225 128" stroke="#cfc5f7" stroke-width="34"/>
              <path d="M25 128A100 100 0 0 1 225 128" stroke="#ddd5fb" stroke-width="28"/>
              <path class="fillp" d="M25 134A100 100 0 0 1 225 134" stroke="#c7334f" stroke-width="26"/>
              <path class="fillp" d="M25 128A100 100 0 0 1 225 128" stroke="url(#gf)" stroke-width="26"/>
              <path class="fillp" d="M25 123A100 100 0 0 1 225 123" stroke="rgba(255,255,255,.45)" stroke-width="5"/>
              <g class="knobg"><circle cx="25" cy="128" r="17" fill="#fff" style="filter:drop-shadow(0 4px 5px rgba(120,20,60,.5))"/><circle cx="25" cy="128" r="7" fill="#ff5d62"/></g>
            </svg>
            <div class="mid"><b class="num" data-count="515.4" data-pre="$" data-split data-delay="300"></b><span class="soft">left to spend</span></div>
          </div>
          <div class="facts well"><span>$1,284.60 of $1,800</span><span class="soft">$73 a day for 7 days</span></div>
        </div>
        <div id="b3"></div>
      </div>
      <nav class="tabs"><button data-i="home" data-go="dash" aria-label="Home"></button><button data-i="pie" aria-label="Categories"></button><button class="fab bead" data-i="plus" aria-label="Add"></button><button class="on" data-i="wallet" aria-label="Budgets"></button><button data-i="chart" aria-label="Insights"></button></nav>
    </div></figure>
  </div>
</main>
<script src="shared.js"></script>
<script>
  const dark = { food: '#b83a2c', home: '#4a3cc0', transport: '#1b8a70', out: '#b87400', other: '#9d94d4' };
  const ring = document.getElementById('ring3');
  ring.insertAdjacentHTML('afterbegin', donut(PULSE.cats, { size: 152, width: 28, gap: 5, stroke: s => dark[s.key] }).replace('class="donut"', 'class="donut under"') + donut(PULSE.cats, { size: 152, width: 28, gap: 5 }));
  ring.querySelector('.under .track').style.stroke = 'transparent';
  document.getElementById('leg3').innerHTML = PULSE.cats.map(c => `<li><i class="bead" style="--c:${c.color}"></i><span>${c.name}</span><b class="num">${Math.round(c.share * 100)}%</b></li>`).join('');
  const col = k => PULSE.cats.find(c => c.key === k).color;
  document.getElementById('tx3').innerHTML = PULSE.tx.map((t, i) => `<div class="row well drop" style="--d:${5 + i}"><div class="bead" style="--c:${col(t.key)}">${icon(t.icon)}</div><div><b>${t.name}</b><small class="soft">${t.cat}, ${t.time}</small></div><div class="a num">-${money(t.amt)}</div></div>`).join('');
  document.getElementById('b3').innerHTML = PULSE.cats.map((c, i) => { const over = c.spent > c.budget, cc = c.key === 'other' ? '#9d8cff' : c.color;
    return `<div class="brow panel drop ${over ? 'over' : ''}" style="--d:${2 + i}"><div class="bead" style="--c:${cc}">${icon(c.icon)}</div><div><div class="l1"><b>${c.name}</b><span class="num">${over ? 'Over by ' + money(c.spent - c.budget) : money(c.spent) + ' <em>of ' + money(c.budget, 0) + '</em>'}</span></div><div class="groove well" style="--w:${Math.min(100, c.spent / c.budget * 100)}%;--c:${over ? '#e4352f' : cc}"><i></i></div></div></div>`; }).join('');
  boot();
</script>
</body>
</html>
