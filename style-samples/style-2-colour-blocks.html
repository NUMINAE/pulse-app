<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse style sample 2: Colour blocks</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ---------- Colour blocks: solid, saturated tiles packed tight. No glass, no gradients on surfaces, no shadows. ---------- */
  .screen { font-weight: 700; }
  .pad { position: absolute; inset: 54px 0 0 0; padding: 10px 16px 0; }
  .blk { border-radius: 32px; position: relative; overflow: hidden; }
  .top { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .pill { height: 46px; padding: 0 12px 0 18px; border-radius: 23px; display: inline-flex; align-items: center; gap: 4px; font: 700 17px Sora; letter-spacing: -0.02em; }
  .pill .ico { width: 20px; height: 20px; stroke-width: 2.6; }
  .ava { width: 46px; height: 46px; border-radius: 23px; display: grid; place-items: center; font: 800 18px Sora; background: var(--lav); color: var(--ink-d); }
  .topr { display: flex; gap: 8px; }
  .sq { width: 46px; height: 46px; border-radius: 23px; display: grid; place-items: center; }

  .hero { margin-top: 12px; height: 172px; padding: 18px 22px; background: var(--coral); color: #fff; }
  .hero svg.mark { position: absolute; right: -46px; bottom: -30px; width: 160px; height: 110px; fill: none; stroke: #ff8468; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 640; stroke-dashoffset: 640; transition: stroke-dashoffset 1.3s cubic-bezier(.3,.8,.2,1) .35s; }
  body.in .hero svg.mark { stroke-dashoffset: 0; }
  .hero .lbl { position: relative; font-size: 15px; color: #4a0f17; }
  .hero .amt { position: relative; font: 800 66px/1 Sora; letter-spacing: -0.055em; margin-top: 6px; }
  .hero .amt small { font-size: 34px; letter-spacing: -0.04em; }
  .hero .tag { position: absolute; left: 18px; bottom: 16px; height: 36px; border-radius: 18px; padding: 0 14px 0 6px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; background: #fff; color: var(--ink-d); }
  .hero .tag i { width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; background: var(--green); color: #06382c; }
  .hero .tag .ico { width: 15px; height: 15px; stroke-width: 3; }

  .bento { display: grid; grid-template-columns: 178px 1fr; gap: 10px; margin-top: 10px; height: 178px; }
  .dtile { display: grid; place-items: center; }
  .dtile .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .dtile .mid b { font: 800 34px/1 Sora; letter-spacing: -0.05em; }
  .dtile .mid span { font-size: 12.5px; margin-top: 2px; }
  .cats { display: grid; gap: 7px; }
  .cats li { list-style: none; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; padding: 0 13px 0 14px; font-size: 13.5px; background: var(--c); color: var(--ink-d); }
  .cats li b { font: 800 14px Sora; letter-spacing: -0.03em; }
  .cats li.w { color: #fff; }

  .sec { display: flex; align-items: center; justify-content: space-between; margin: 14px 6px 8px; }
  .sec h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
  .sec a { font-size: 13.5px; height: 30px; padding: 0 13px; border-radius: 15px; display: inline-flex; align-items: center; }
  .row { display: grid; grid-template-columns: 62px 1fr auto; align-items: center; gap: 14px; height: 60px; border-radius: 22px; margin-bottom: 8px; padding-right: 18px; overflow: hidden; }
  .row .tile { width: 62px; height: 60px; border-radius: 22px; display: grid; place-items: center; background: var(--c); color: var(--ink-d); }
  .row .tile.w { color: #fff; }
  .row .tile .ico { width: 25px; height: 25px; stroke-width: 2.2; }
  .row b { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
  .row small { font-size: 12.5px; font-weight: 700; }
  .row .a { font: 800 18px Sora; letter-spacing: -0.04em; }

  .tabs { position: absolute; left: 14px; right: 14px; bottom: 24px; height: 68px; border-radius: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; z-index: 20; }
  .tabs button { width: 52px; height: 52px; border-radius: 26px; display: grid; place-items: center; }
  .tabs .on { width: auto; padding: 0 20px 0 16px; display: inline-flex; gap: 8px; align-items: center; font: 700 15px Sora; letter-spacing: -0.02em; background: var(--coral); color: #fff; }
  .tabs .add { background: var(--ink-d); color: #fff; }
  .tabs .add .ico { stroke-width: 2.8; }

  /* ----- dark ----- */
  .dark { background: #120c2b; color: #fff; }
  .dark .tile-bg, .dark .pill, .dark .sq, .dark .row, .dark .dtile, .dark .sec a { background: #251b63; }
  .dark .soft { color: #b9adff; }
  .dark .track { stroke: #382b85; }
  .dark .tabs { background: #f4f1ff; color: var(--ink-d); }

  /* ----- light ----- */
  .light { background: #ece7ff; color: var(--ink-d); }
  .light .status, .light .home-ind { color: var(--ink-d); }
  .light .soft { color: #5b528c; }
  .light .pill { background: var(--ink-d); color: #fff; }
  .light .tabs { background: var(--ink-d); color: #fff; }
  .light .tabs .add { background: #fff; color: var(--ink-d); }

  /* budgets */
  .bhead { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 4px; }
  .bhead h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.05em; }
  .left { margin-top: 12px; padding: 20px 22px 20px; background: #6a58f5; color: #fff; }
  .left .lbl { font-size: 15px; color: #e2dcff; }
  .left .amt { font: 800 60px/1 Sora; letter-spacing: -0.055em; margin-top: 6px; }
  .left .amt small { font-size: 31px; }
  .meter { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; margin-top: 18px; height: 30px; }
  .meter i { border-radius: 8px; background: #8a7bff; transform-origin: bottom; }
  .meter i.f { background: #fff; transform: scaleY(.2); opacity: .2; transition: transform .5s cubic-bezier(.3,1.6,.5,1) calc(var(--n) * 45ms + .4s), opacity .2s calc(var(--n) * 45ms + .4s); }
  body.in .meter i.f { transform: none; opacity: 1; }
  .meter i.now { background: var(--coral); }
  .facts { display: flex; justify-content: space-between; margin-top: 12px; font-size: 14px; }
  .facts span:last-child { color: #e2dcff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .bt { height: 126px; border-radius: 30px; padding: 12px 12px 13px; position: relative; overflow: hidden; background: color-mix(in srgb, var(--c) 30%, #fff); display: flex; flex-direction: column; justify-content: space-between; }
  .bt .fill { position: absolute; inset: auto 0 0 0; height: 100%; background: var(--c); transform: translateY(100%); transition: transform 1.1s cubic-bezier(.2,1.2,.3,1) calc(var(--d) * 90ms + .45s); }
  body.in .bt .fill { transform: translateY(calc(100% - var(--w))); }
  .bt > * { position: relative; }
  .bt .h { display: flex; justify-content: space-between; align-items: center; font-size: 14.5px; font-weight: 800; }
  .bt .h span { height: 34px; padding: 0 14px; border-radius: 17px; background: #fff; display: inline-flex; align-items: center; }
  .bt .h em { width: 34px; height: 34px; border-radius: 17px; background: #fff; display: grid; place-items: center; }
  .bt .h .ico { width: 19px; height: 19px; stroke-width: 2.3; }
  .bt .v { padding: 0 5px; }
  .bt .v b { display: block; font: 800 23px/1.1 Sora; letter-spacing: -0.05em; }
  .bt .v span { font-size: 12.5px; }
  .bt.over .v span { display: inline-flex; height: 24px; align-items: center; padding: 0 10px; margin-top: 4px; border-radius: 12px; background: var(--ink-d); color: #fff; }
  .bt.new { background: var(--ink-d); color: #fff; align-items: flex-start; padding: 14px 16px; text-align: left; }
  .bt.new i { width: 44px; height: 44px; border-radius: 22px; background: var(--coral); display: grid; place-items: center; }
  .bt.new b { font: 800 19px/1.15 Sora; letter-spacing: -0.04em; }

  /* motion: blocks drop in with a small overshoot */
  .pop { opacity: 0; }
  body.in .pop { animation: pop .7s cubic-bezier(.2,1.5,.4,1) both; animation-delay: calc(var(--d, 0) * 60ms); }
  @keyframes pop { from { opacity: 0; transform: translateY(34px) scale(.86); } 40% { opacity: 1; } to { opacity: 1; transform: none; } }
  .seg { stroke-dasharray: 0 calc(var(--c) * 1px); transition: stroke-dasharray .9s cubic-bezier(.3,1.3,.4,1) calc(var(--i) * 120ms + .45s); }
  body.in .seg { stroke-dasharray: calc(var(--len) * 1px) calc(var(--c) * 1px); }
</style>
</head>
<body>
<main class="stage">
  <header><h1>style-2-colour-blocks.html</h1><p>Colour blocks: solid, saturated tiles packed tight like a bento box. Dashboard in dark, Budgets in light.</p></header>
  <div class="phones">
    <figure class="device" data-screen="dash"><div class="screen dark">
      <div class="pad">
        <div class="top pop"><button class="pill">November<svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="topr"><button class="sq" data-i="bell" aria-label="Notifications"></button><div class="ava">M</div></div></div>
        <div class="hero blk pop" style="--d:1"><svg class="mark" viewBox="0 0 250 170"><path d="M10 96h62l26-74 46 140 24-66h76"/></svg><div class="lbl">Spent in November</div><div class="amt num" data-count="1284.6" data-pre="$" data-split></div><span class="tag"><i data-i="down"></i>12% less than October</span></div>
        <div class="bento"><div class="dtile blk pop" style="--d:2" id="ring2"><div class="mid"><b class="num" data-count="34" data-dec="0" data-suf="%" data-delay="450"></b><span class="soft">on food</span></div></div><ul class="cats" id="cats2"></ul></div>
        <div class="sec pop" style="--d:8"><h2>Today</h2><a class="soft">See all</a></div>
        <div id="tx2"></div>
      </div>
      <nav class="tabs"><button class="on" data-i="home">Home</button><button data-i="pie" aria-label="Categories"></button><button data-i="wallet" data-go="budget" aria-label="Budgets"></button><button data-i="chart" aria-label="Insights"></button><button class="add" data-i="plus" aria-label="Add"></button></nav>
    </div></figure>

    <figure class="device" data-screen="budget"><div class="screen light">
      <div class="pad">
        <div class="bhead pop"><h1>Budgets</h1><button class="pill">November<svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
        <div class="left blk pop" style="--d:1"><div class="lbl">Left to spend</div><div class="amt num" data-count="515.4" data-pre="$" data-split></div><div class="meter" id="meter2"></div><div class="facts"><span>$1,284.60 of $1,800</span><span>$73 a day for 7 days</span></div></div>
        <div class="grid" id="b2"></div>
      </div>
      <nav class="tabs"><button data-i="home" data-go="dash" aria-label="Home"></button><button data-i="pie" aria-label="Categories"></button><button class="on" data-i="wallet">Budgets</button><button data-i="chart" aria-label="Insights"></button><button class="add" data-i="plus" aria-label="Add"></button></nav>
    </div></figure>
  </div>
</main>
<script src="shared.js"></script>
<script>
  const white = k => k === 'home';
  document.getElementById('ring2').insertAdjacentHTML('afterbegin', donut(PULSE.cats, { size: 146, width: 30, gap: 5 }));
  document.getElementById('cats2').innerHTML = PULSE.cats.map((c, i) => `<li class="pop ${white(c.key) ? 'w' : ''}" style="--c:${c.color};--d:${3 + i}"><span>${c.name}</span><b class="num">${Math.round(c.share * 100)}%</b></li>`).join('');
  const cat = k => PULSE.cats.find(c => c.key === k);
  document.getElementById('tx2').innerHTML = PULSE.tx.slice(0, 3).map((t, i) => `<div class="row pop" style="--d:${9 + i};--c:${cat(t.key).color}"><div class="tile ${white(t.key) ? 'w' : ''}">${icon(t.icon)}</div><div><b>${t.name}</b><small class="soft">${t.cat}, ${t.time}</small></div><div class="a num">-${money(t.amt)}</div></div>`).join('');
  document.getElementById('meter2').innerHTML = Array.from({ length: 14 }, (_, i) => `<i class="${i < 10 ? 'f' : ''} ${i === 9 ? 'now' : ''}" style="--n:${i}"></i>`).join('');
  document.getElementById('b2').innerHTML = PULSE.cats.map((c, i) => { const over = c.spent > c.budget, col = c.key === 'other' ? '#b9adff' : c.color;
    return `<div class="bt pop ${over ? 'over' : ''}" style="--d:${2 + i};--c:${col};--w:${Math.min(100, c.spent / c.budget * 100)}%"><div class="fill"></div><div class="h"><span>${c.name}</span><em>${icon(c.icon)}</em></div><div class="v"><b class="num">${money(c.spent)}</b><span>${over ? 'Over by ' + money(c.spent - c.budget) : 'of ' + money(c.budget, 0)}</span></div></div>`; }).join('')
    + `<button class="bt new pop" style="--d:7"><i>${icon('plus')}</i><b>New<br>budget</b></button>`;
  boot();
</script>
</body>
</html>
