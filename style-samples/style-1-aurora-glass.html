<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse style sample 1: Aurora glass</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ---------- Aurora glass: frosted panels floating over a slow violet and coral aurora ---------- */
  .screen { font-weight: 600; }
  .aurora { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
  .aurora i { position: absolute; border-radius: 50%; filter: blur(56px); will-change: transform; }
  .glass { position: relative; border-radius: 32px; -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%); }
  /* specular rim: bright top-left, fading round the edge */
  .glass::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .pad { position: absolute; inset: 54px 0 0 0; padding: 10px 20px 0; -webkit-mask-image: linear-gradient(#000 calc(100% - 150px), transparent calc(100% - 86px)); mask-image: linear-gradient(#000 calc(100% - 150px), transparent calc(100% - 86px)); }
  .top { display: flex; align-items: center; gap: 12px; height: 48px; }
  .top .who { flex: 1; line-height: 1.15; }
  .top .who small { display: block; font-size: 13px; font-weight: 600; }
  .top .who b { font: 700 18px Sora; letter-spacing: -0.02em; }
  .ava { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 17px Sora; color: #fff; background: linear-gradient(135deg, var(--coral-a), var(--coral-b)); box-shadow: 0 8px 20px -6px rgba(255,77,109,.7), inset 0 1px 0 rgba(255,255,255,.5); }
  .round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; }
  .round .dot { position: absolute; top: 11px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 10px var(--coral); }

  .hero { margin-top: 20px; }
  .hero .lbl { font-size: 15px; }
  .hero .amt { font: 700 58px/1.05 Sora; letter-spacing: -0.045em; margin-top: 4px; }
  .hero .amt small { font-size: 30px; letter-spacing: -0.03em; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px 0 9px; border-radius: 16px; font-size: 13.5px; font-weight: 700; margin-top: 10px; }
  .chip .ico { width: 16px; height: 16px; stroke-width: 2.6; }

  .ringcard { margin-top: 20px; padding: 20px 18px 20px 16px; display: flex; align-items: center; gap: 16px; }
  .ring { position: relative; width: 164px; height: 164px; flex: none; }
  .ring svg { overflow: visible; }
  .ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .mid b { font: 700 36px/1 Sora; letter-spacing: -0.04em; }
  .ring .mid span { font-size: 13px; margin-top: 3px; }
  .legend { flex: 1; display: grid; gap: 9px; }
  .legend li { list-style: none; display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 9px; font-size: 14.5px; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); }
  .legend b { font: 700 14.5px Sora; letter-spacing: -0.02em; }

  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 4px 10px; }
  .sec h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .sec a { font-size: 14px; font-weight: 700; }
  .row { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 13px; padding: 11px 16px 11px 11px; border-radius: 24px; margin-bottom: 9px; }
  .tile { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; color: #fff; background: linear-gradient(140deg, color-mix(in srgb, var(--c) 75%, #fff), var(--c)); box-shadow: 0 8px 18px -6px var(--c), inset 0 1px 0 rgba(255,255,255,.55); }
  .tile .ico { width: 22px; height: 22px; }
  .row b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .row small { font-size: 13px; font-weight: 600; }
  .row .a { font: 700 17px Sora; letter-spacing: -0.03em; }

  .tabs { position: absolute; left: 16px; right: 16px; bottom: 26px; height: 68px; border-radius: 34px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; justify-items: center; z-index: 20; }
  .tabs button { width: 48px; height: 48px; border-radius: 24px; display: grid; place-items: center; }
  .tabs .fab { width: 54px; height: 54px; border-radius: 27px; color: #fff; background: linear-gradient(135deg, var(--coral-a), var(--coral-b)); box-shadow: 0 10px 24px -6px rgba(255,77,109,.8), inset 0 1.5px 0 rgba(255,255,255,.55); }
  .tabs .fab .ico { stroke-width: 2.6; }

  /* ----- dark ----- */
  .dark { background: #120c2b; color: #fff; }
  .dark .aurora .a { width: 380px; height: 380px; left: 120px; top: -150px; background: #5b3ff0; opacity: .85; animation: drift1 16s ease-in-out infinite alternate; }
  .dark .aurora .b { width: 300px; height: 300px; left: -130px; top: 250px; background: #ff5a4f; opacity: .5; animation: drift2 19s ease-in-out infinite alternate; }
  .dark .aurora .c { width: 340px; height: 340px; left: 150px; top: 560px; background: #7c6cff; opacity: .55; animation: drift1 22s ease-in-out infinite alternate-reverse; }
  .dark .soft { color: rgba(230,224,255,.78); }
  .dark .glass { background: linear-gradient(140deg, rgba(255,255,255,.17), rgba(255,255,255,.055) 60%, rgba(255,255,255,.09)); box-shadow: 0 24px 44px -22px rgba(6,2,26,.9); }
  .dark .glass::before { background: linear-gradient(140deg, rgba(255,255,255,.75), rgba(255,255,255,.08) 38%, rgba(255,255,255,.03) 62%, rgba(255,255,255,.3)); }
  .dark .chip { color: #7df0d0; background: rgba(51,199,163,.2); box-shadow: inset 0 0 0 1.5px rgba(51,199,163,.45); }
  .dark .track { stroke: rgba(255,255,255,.09); }
  .dark .sec a { color: var(--lav); }
  .dark .tabs button { color: rgba(230,224,255,.7); }
  .dark .tabs .on { color: #fff; background: rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
  .dark .tabs { background: linear-gradient(140deg, rgba(58,44,132,.82), rgba(28,19,78,.8)); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 20px 40px -12px rgba(4,1,20,.9); }
  .light .tabs { background: linear-gradient(140deg, rgba(255,255,255,.9), rgba(255,255,255,.72)); }

  /* ----- light ----- */
  .light { background: #f1edff; color: var(--ink-d); }
  .light .aurora .a { width: 360px; height: 360px; left: 130px; top: -140px; background: #9f8cff; opacity: .95; animation: drift1 16s ease-in-out infinite alternate; }
  .light .aurora .b { width: 300px; height: 300px; left: -140px; top: 240px; background: #ff9f8a; opacity: .85; animation: drift2 19s ease-in-out infinite alternate; }
  .light .aurora .c { width: 320px; height: 320px; left: 170px; top: 560px; background: #8fe6cf; opacity: .8; animation: drift1 22s ease-in-out infinite alternate-reverse; }
  .light .soft { color: rgba(26,20,64,.62); }
  .light .glass { background: linear-gradient(140deg, rgba(255,255,255,.82), rgba(255,255,255,.46) 60%, rgba(255,255,255,.62)); box-shadow: 0 22px 40px -22px rgba(74,52,170,.5); }
  .light .glass::before { background: linear-gradient(140deg, #fff, rgba(255,255,255,.5) 40%, rgba(255,255,255,.2) 62%, rgba(255,255,255,.95)); }
  .light .status, .light .home-ind { color: var(--ink-d); }
  .light .tabs button { color: rgba(26,20,64,.55); }
  .light .tabs .on { color: var(--ink-d); background: #fff; box-shadow: 0 6px 14px -6px rgba(74,52,170,.5); }
  .light .tabs .fab { color: #fff; }

  /* budgets */
  .bhead { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .bhead h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.04em; }
  .month { height: 40px; padding: 0 10px 0 16px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; font-size: 14.5px; font-weight: 700; }
  .month .ico { width: 18px; height: 18px; }
  .left { margin-top: 16px; padding: 20px 20px 18px; }
  .left .lbl { font-size: 14.5px; }
  .left .amt { font: 700 50px/1.05 Sora; letter-spacing: -0.045em; margin-top: 2px; }
  .left .amt small { font-size: 27px; }
  .tube { position: relative; height: 22px; border-radius: 11px; margin-top: 16px; background: rgba(26,20,64,.09); box-shadow: inset 0 2px 4px rgba(26,20,64,.16); overflow: hidden; }
  .tube i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--coral-a), var(--coral-b)); box-shadow: inset 0 3px 3px rgba(255,255,255,.5), 0 0 16px rgba(255,90,90,.6); transition: width 1.3s cubic-bezier(.2,.9,.2,1) .35s; }
  body.in .tube i { width: var(--w); }
  .facts { display: flex; justify-content: space-between; margin-top: 12px; font-size: 14px; font-weight: 700; }
  .brow { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; padding: 13px 16px 13px 12px; border-radius: 26px; margin-top: 9px; }
  .brow .tile { width: 44px; height: 44px; border-radius: 15px; }
  .brow .l1 { display: flex; justify-content: space-between; align-items: baseline; }
  .brow .l1 b { font-size: 15.5px; font-weight: 700; }
  .brow .l1 span { font: 700 13.5px Sora; letter-spacing: -0.02em; }
  .brow .l1 span em { font-style: normal; font-weight: 600; opacity: .6; }
  .bar { height: 10px; border-radius: 5px; margin-top: 8px; background: rgba(26,20,64,.09); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c); box-shadow: inset 0 2px 1px rgba(255,255,255,.45); transition: width 1.1s cubic-bezier(.2,.9,.2,1) calc(var(--d) * 80ms + .5s); }
  body.in .bar i { width: var(--w); }
  .brow.over .l1 span { color: #e4352f; }

  /* motion */
  .rise { opacity: 0; }
  body.in .rise { animation: rise .8s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--d, 0) * 70ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.97); filter: blur(8px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .seg { stroke-dasharray: 0 calc(var(--c) * 1px); opacity: 0; filter: drop-shadow(0 0 5px currentColor); transition: stroke-dasharray 1.2s cubic-bezier(.2,.9,.2,1) calc(var(--i) * 110ms + .45s), opacity .2s calc(var(--i) * 110ms + .45s); }
  body.in .seg { stroke-dasharray: calc(var(--len) * 1px) calc(var(--c) * 1px); opacity: 1; }
  @keyframes drift1 { to { transform: translate(-70px, 60px) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(90px, -50px) scale(.9); } }
</style>
</head>
<body>
<main class="stage">
  <header><h1>style-1-aurora-glass.html</h1><p>Aurora glass: frosted panels floating over a slow violet and coral aurora. Dashboard in dark, Budgets in light.</p></header>
  <div class="phones">
    <figure class="device" data-screen="dash"><div class="screen dark">
      <div class="aurora"><i class="a"></i><i class="b"></i><i class="c"></i></div>
      <div class="pad">
        <div class="top rise"><div class="ava">M</div><div class="who"><small class="soft">Good evening</small><b>Maya</b></div><button class="round glass" data-i="bell" aria-label="Notifications"><span class="dot"></span></button></div>
        <div class="hero rise" style="--d:1"><div class="lbl soft">Spent in November</div><div class="amt num" data-count="1284.6" data-pre="$" data-split></div><span class="chip" data-i="down">12% less than October</span></div>
        <div class="ringcard glass rise" style="--d:2"><div class="ring" id="ring1"><div class="mid"><b class="num" data-count="34" data-dec="0" data-suf="%" data-delay="450"></b><span class="soft">on food</span></div></div><ul class="legend" id="leg1"></ul></div>
        <div class="sec rise" style="--d:3"><h2>Today</h2><a>See all</a></div>
        <div id="tx1"></div>
      </div>
      <nav class="tabs glass"><button class="on" data-i="home" aria-label="Home"></button><button data-i="pie" aria-label="Categories"></button><button class="fab" data-i="plus" aria-label="Add"></button><button data-i="wallet" data-go="budget" aria-label="Budgets"></button><button data-i="chart" aria-label="Insights"></button></nav>
    </div></figure>

    <figure class="device" data-screen="budget"><div class="screen light">
      <div class="aurora"><i class="a"></i><i class="b"></i><i class="c"></i></div>
      <div class="pad">
        <div class="bhead rise"><h1>Budgets</h1><button class="month glass">November<svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
        <div class="left glass rise" style="--d:1"><div class="lbl soft">Left to spend</div><div class="amt num" data-count="515.4" data-pre="$" data-split></div><div class="tube" style="--w:71.4%"><i></i></div><div class="facts"><span>$1,284.60 of $1,800</span><span class="soft">$73 a day for 7 days</span></div></div>
        <div id="b1"></div>
      </div>
      <nav class="tabs glass"><button data-i="home" data-go="dash" aria-label="Home"></button><button data-i="pie" aria-label="Categories"></button><button class="fab" data-i="plus" aria-label="Add"></button><button class="on" data-i="wallet" aria-label="Budgets"></button><button data-i="chart" aria-label="Insights"></button></nav>
    </div></figure>
  </div>
</main>
<script src="shared.js"></script>
<script>
  const grad = { food: ['#ff9a6c', '#ff4d6d'], home: ['#a79bff', '#6a58ff'], transport: ['#6ff0cf', '#22b392'], out: ['#ffd067', '#ff9d0a'], other: ['#ffffff', '#cfc6ff'] };
  const defs = '<defs>' + Object.entries(grad).map(([k, [a, b]]) => `<linearGradient id="g-${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`).join('') + '</defs>';
  document.getElementById('ring1').insertAdjacentHTML('afterbegin', donut(PULSE.cats, { size: 164, width: 24, gap: 4, cap: 'round', defs, stroke: s => `url(#g-${s.key})` }));
  document.querySelectorAll('#ring1 .seg').forEach((c, i) => c.style.color = PULSE.cats[i].color);
  document.getElementById('leg1').innerHTML = PULSE.cats.map(c => `<li style="--c:${c.color}"><i></i><span>${c.name}</span><b class="num">${Math.round(c.share * 100)}%</b></li>`).join('');
  const col = k => PULSE.cats.find(c => c.key === k).color;
  document.getElementById('tx1').innerHTML = PULSE.tx.map((t, i) => `<div class="row glass rise" style="--d:${4 + i};--c:${col(t.key)}"><div class="tile">${icon(t.icon)}</div><div><b>${t.name}</b><small class="soft">${t.cat}, ${t.time}</small></div><div class="a num">-${money(t.amt)}</div></div>`).join('');
  document.getElementById('b1').innerHTML = PULSE.cats.map((c, i) => { const over = c.spent > c.budget;
    return `<div class="brow glass rise ${over ? 'over' : ''}" style="--d:${2 + i};--c:${c.key === 'other' ? '#9d8cff' : c.color}"><div class="tile">${icon(c.icon)}</div><div><div class="l1"><b>${c.name}</b><span class="num">${over ? 'Over by ' + money(c.spent - c.budget) : money(c.spent) + ' <em>of ' + money(c.budget, 0) + '</em>'}</span></div><div class="bar" style="--w:${Math.min(100, c.spent / c.budget * 100)}%;${over ? '--c:#e4352f' : ''}"><i></i></div></div></div>`; }).join('');
  boot();
</script>
</body>
</html>
